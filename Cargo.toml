[package]
name = "resuma-docs"
version = "2.0.1"
edition = "2021"
publish = false

[[bin]]
name = "website"
path = "src/main.rs"

[dependencies]
axum = "0.8"
resuma = { git = "https://github.com/GoldevLab/resuma.git", rev = "36527ae1c1a8fb31d0e3cec3d3abcc9975ba2f7c" }
resuma-flow = { git = "https://github.com/GoldevLab/resuma.git", rev = "36527ae1c1a8fb31d0e3cec3d3abcc9975ba2f7c", package = "resuma-flow" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
